<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Five Clash</title>
<style>
:root{
  --bg1:#182231;--bg2:#0b1018;--panel:rgba(18,25,35,.92);
  --line:rgba(255,255,255,.1);--text:#f5f7fa;--muted:#98a4b5;
  --accent:#e7b75a;--accent2:#f4d694;--blue:#63aaf8;--red:#ed6c6c;
  --board1:#ddb36b;--board2:#b97e3b;--boardBorder:#75471d;
  --black1:#50545b;--black2:#050608;--white1:#fff;--white2:#c7cbd0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{
  display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;
  color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  background:radial-gradient(circle at 50% 0%,rgba(71,91,120,.3),transparent 45%),linear-gradient(160deg,#111823,#05070b)
}
button{font:inherit;color:inherit}
.app{
  position:relative;width:min(100vw,720px,56.25vh);aspect-ratio:9/16;max-height:1280px;
  overflow:hidden;isolation:isolate;
  background:
    radial-gradient(circle at 50% 10%,rgba(77,97,129,.28),transparent 35%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  box-shadow:0 0 90px rgba(0,0,0,.65)
}
.screen{
  position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .6s ease,visibility .6s ease
}
.screen.active{opacity:1;visibility:visible;pointer-events:auto}
.screen.fade-out{opacity:0;pointer-events:none}
.grid-bg{
  position:absolute;inset:0;opacity:.035;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.9) 1px,transparent 1px);
  background-size:48px 48px
}
.corner{position:absolute;width:110px;height:110px;border-color:rgba(231,183,90,.22);pointer-events:none}
.corner.tl{top:7%;left:7%;border-top:1px solid;border-left:1px solid}
.corner.br{right:7%;bottom:7%;border-right:1px solid;border-bottom:1px solid}
.primary-btn{
  position:relative;min-width:250px;padding:18px 34px;overflow:hidden;
  color:#251a0b;background:linear-gradient(180deg,var(--accent2),var(--accent));
  border:1px solid rgba(255,255,255,.45);border-radius:14px;
  font-weight:900;letter-spacing:.12em;cursor:pointer;
  box-shadow:0 14px 34px rgba(231,183,90,.26),inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .25s ease,filter .25s ease,opacity .4s ease
}
.primary-btn:before{
  content:"";position:absolute;top:0;left:-130%;width:80%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-20deg);transition:left .6s ease
}
.primary-btn:hover:before{left:145%}
.primary-btn:hover{transform:translateY(-3px);filter:brightness(1.06)}
.secondary-btn{
  min-width:210px;padding:14px 24px;border-radius:12px;cursor:pointer;
  color:var(--text);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13)
}
.hero-screen{
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:9%
}
.hero-emblem{
  position:relative;width:38%;aspect-ratio:1;margin-bottom:9%;
  border:1px solid rgba(231,183,90,.5);border-radius:22px;
  background:
    linear-gradient(90deg,transparent 49%,rgba(231,183,90,.28) 49%,rgba(231,183,90,.28) 51%,transparent 51%),
    linear-gradient(transparent 49%,rgba(231,183,90,.28) 49%,rgba(231,183,90,.28) 51%,transparent 51%),
    rgba(255,255,255,.02);
  box-shadow:0 0 40px rgba(231,183,90,.1),inset 0 0 40px rgba(255,255,255,.02)
}
.hero-emblem:before,.hero-emblem:after{
  content:"";position:absolute;top:50%;width:25%;aspect-ratio:1;border-radius:50%;transform:translateY(-50%)
}
.hero-emblem:before{
  left:18%;background:radial-gradient(circle at 32% 28%,var(--black1),var(--black2) 72%);
  box-shadow:0 8px 18px rgba(0,0,0,.45)
}
.hero-emblem:after{
  right:18%;background:radial-gradient(circle at 32% 28%,var(--white1),var(--white2) 72%);
  box-shadow:0 8px 18px rgba(0,0,0,.3)
}
.hero-title{
  color:var(--accent);font-size:clamp(2.2rem,7.5vw,4.2rem);font-weight:950;letter-spacing:.14em;
  text-shadow:0 0 30px rgba(231,183,90,.25)
}
.hero-subtitle{margin-top:12px;color:var(--muted);font-size:clamp(.72rem,2.4vw,1rem);letter-spacing:.28em}
.hero-rule{
  width:min(62%,390px);height:1px;margin:8% 0;background:linear-gradient(90deg,transparent,rgba(231,183,90,.65),transparent)
}
.hero-note{margin-top:18px;color:var(--muted);font-size:.76rem;letter-spacing:.08em}
.mode-screen{padding:8%;display:flex;flex-direction:column}
.mode-header{margin-top:5%;margin-bottom:7%}
.mode-kicker{color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.22em;margin-bottom:10px}
.mode-title{font-size:clamp(1.8rem,6vw,3rem);font-weight:950}
.mode-description{margin-top:10px;color:var(--muted);font-size:.86rem;line-height:1.7}
.mode-list{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mode-card{
  position:relative;min-height:190px;padding:20px;text-align:left;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.11);border-radius:18px;cursor:pointer;
  transition:transform .25s ease,border-color .25s ease,background .25s ease
}
.mode-card:hover{transform:translateY(-4px);border-color:rgba(231,183,90,.45);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.035))}
.mode-card.locked{cursor:not-allowed;opacity:.62}
.mode-number{color:var(--accent);font-size:.72rem;font-weight:900;letter-spacing:.16em}
.mode-name{margin-top:10px;font-size:1.2rem;font-weight:900}
.mode-desc{margin-top:8px;color:var(--muted);font-size:.76rem;line-height:1.6}
.mode-status{
  position:absolute;right:14px;bottom:14px;padding:6px 9px;border-radius:999px;
  color:#1e1609;background:var(--accent);font-size:.62rem;font-weight:900;letter-spacing:.08em
}
.mode-status.locked{color:var(--muted);background:rgba(255,255,255,.08)}
.mode-footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.mode-back{
  padding:12px 16px;border:1px solid rgba(255,255,255,.1);border-radius:10px;
  background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer
}
.mode-message{color:var(--muted);font-size:.72rem}
.battle-screen{display:flex;flex-direction:column;padding:3.2%}
.battle-header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;min-height:112px}
.fighter-status.ai{text-align:right}
.fighter-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.fighter-status.ai .fighter-row{flex-direction:row-reverse}
.fighter-name{font-size:clamp(.7rem,2.3vw,1rem);font-weight:850;letter-spacing:.08em}
.hp-text{color:var(--muted);font-size:clamp(.6rem,1.9vw,.78rem)}
.hp-shell{position:relative;height:clamp(16px,2.8vw,24px);overflow:hidden;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.14);border-radius:6px}
.hp{position:absolute;top:0;bottom:0;width:100%;transition:width .85s cubic-bezier(.25,.85,.3,1),filter .3s ease}
.hp.player{left:0;background:linear-gradient(180deg,#9acbff,var(--blue))}
.hp.ai{right:0;background:linear-gradient(180deg,#f5aaaa,var(--red))}
.hp.flash{filter:brightness(1.8)}
.score-center{min-width:124px;text-align:center}
.score-row{display:grid;grid-template-columns:34px auto 34px;align-items:center;gap:8px}
.score{font-size:clamp(1.4rem,4.7vw,2.2rem);font-weight:950}
.score.player{color:#9acbff;text-align:right}.score.ai{color:#f5aaaa;text-align:left}
.vs{color:var(--accent);font-weight:950}
.round{display:block;margin-top:9px;color:var(--muted);font-size:.72rem;letter-spacing:.12em}
.status-bar{
  display:flex;justify-content:space-between;align-items:center;min-height:52px;margin-bottom:2.5%;padding:0 14px;
  border:1px solid rgba(255,255,255,.085);border-radius:12px;background:rgba(255,255,255,.045)
}
.turn-box{display:flex;align-items:center;gap:9px}
.turn-stone{width:24px;aspect-ratio:1;border-radius:50%}
.turn-stone.black{background:radial-gradient(circle at 32% 28%,var(--black1),var(--black2) 72%)}
.turn-stone.white{background:radial-gradient(circle at 32% 28%,var(--white1),var(--white2) 72%)}
.turn-text{font-size:.86rem;font-weight:750}.move{color:var(--muted);font-size:.75rem}
.board-section{display:flex;justify-content:center;align-items:center;flex:1;min-height:0}
.board-frame{
  position:relative;width:min(91vw,92%,640px);aspect-ratio:1;padding:4.6%;
  background:linear-gradient(145deg,var(--board1),var(--board2));
  border:clamp(4px,1vw,8px) solid var(--boardBorder);border-radius:15px;
  box-shadow:0 20px 42px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.1);
  user-select:none;touch-action:manipulation
}
.board-frame.locked{pointer-events:none}
.board-grid{
  position:relative;width:100%;height:100%;
  background-image:linear-gradient(to right,transparent calc(100% - 1px),var(--board-line) calc(100% - 1px)),linear-gradient(to bottom,transparent calc(100% - 1px),var(--board-line) calc(100% - 1px));
  background-size:calc(100% / 14) calc(100% / 14);
  border-top:1px solid var(--board-line);border-left:1px solid var(--board-line)
}
.board-points,.star-points{position:absolute;inset:0}
.star-point{position:absolute;width:1.8%;min-width:5px;aspect-ratio:1;transform:translate(-50%,-50%);background:var(--board-line);border-radius:50%;pointer-events:none}
.intersection{
  position:absolute;width:calc(100% / 14);aspect-ratio:1;transform:translate(-50%,-50%);
  border:0;border-radius:50%;background:transparent;cursor:pointer
}
.intersection:before{
  content:"";position:absolute;inset:14%;border-radius:50%;background:#111;opacity:0;transform:scale(.75);
  transition:opacity .18s ease,transform .18s ease
}
.board-frame.player-turn .intersection:not(.occupied):hover:before{opacity:.2;transform:scale(1)}
.stone{position:absolute;top:50%;left:50%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);border-radius:50%;pointer-events:none;animation:stonePlace .19s cubic-bezier(.2,1.25,.5,1) forwards}
.stone.black{background:radial-gradient(circle at 32% 27%,var(--black1),var(--black2) 72%);box-shadow:0 4px 8px rgba(0,0,0,.42)}
.stone.white{background:radial-gradient(circle at 32% 27%,var(--white1),var(--white2) 72%);box-shadow:0 4px 8px rgba(0,0,0,.3)}
.last-marker{position:absolute;top:50%;left:50%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid #ff5e5e;border-radius:50%;pointer-events:none}
.winner .stone{outline:3px solid #72d689;outline-offset:2px;animation:stonePlace .19s cubic-bezier(.2,1.25,.5,1) forwards,winnerPulse .7s ease-in-out infinite alternate}
@keyframes stonePlace{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes winnerPulse{to{filter:brightness(1.4)}}
.battle-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:62px;margin-top:2.5%}
.footer-btn{padding:11px 15px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer}
.best-of{color:var(--muted);font-size:.72rem;letter-spacing:.1em}
.round-transition,.result-overlay{
  position:absolute;inset:0;display:flex;justify-content:center;align-items:center;padding:8%;
  opacity:0;visibility:hidden;pointer-events:none;z-index:50;
  background:radial-gradient(circle at center,rgba(27,37,51,.93),rgba(5,8,12,.95) 68%);
  transition:opacity .5s ease,visibility .5s ease
}
.round-transition.show,.result-overlay.show{opacity:1;visibility:visible;pointer-events:auto}
.round-transition.fade-out{opacity:0}
.round-content{text-align:center}
.round-label{color:var(--accent);font-size:.78rem;font-weight:850;letter-spacing:.28em}
.round-title{margin-top:14px;font-size:clamp(2rem,7vw,3.8rem);font-weight:950}
.round-desc{margin-top:12px;color:var(--muted);font-size:.8rem;letter-spacing:.16em}
.result-card{width:min(100%,470px);padding:34px 28px;text-align:center;background:linear-gradient(165deg,rgba(31,41,55,.98),rgba(15,21,29,.98));border:1px solid rgba(255,255,255,.13);border-radius:20px}
.result-kicker{color:var(--accent);font-size:.75rem;font-weight:850;letter-spacing:.22em}
.result-title{margin-top:10px;font-size:clamp(1.65rem,5vw,2.4rem);font-weight:950}
.result-desc{margin-top:10px;color:var(--muted);line-height:1.7}
.final-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:22px 0;padding:18px;background:rgba(255,255,255,.045);border-radius:12px}
.final-num{font-size:2rem;font-weight:950}
.result-actions{display:flex;flex-direction:column;align-items:center;gap:12px}
.locked-toast{
  position:absolute;left:50%;bottom:8%;transform:translate(-50%,20px);padding:12px 18px;
  color:var(--text);background:rgba(9,13,19,.92);border:1px solid rgba(255,255,255,.12);border-radius:10px;
  opacity:0;visibility:hidden;transition:.3s ease;z-index:80;white-space:nowrap
}
.locked-toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.app.shake{animation:shake .38s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media(max-height:760px){
  .battle-header{min-height:82px}.status-bar{min-height:42px}.battle-footer{min-height:44px}.board-frame{width:min(82%,560px)}
}
</style>
</head>
<body>
<main id="app" class="app">
  <div class="grid-bg"></div>
  <span class="corner tl"></span><span class="corner br"></span>

  <section id="heroScreen" class="screen hero-screen active">
    <div class="hero-emblem"></div>
    <h1 class="hero-title">FIVE CLASH</h1>
    <p class="hero-subtitle">TACTICAL BOARD DUEL</p>
    <div class="hero-rule"></div>
    <button id="openModesButton" class="primary-btn" type="button">開始遊玩</button>
    <p class="hero-note">以五子棋為核心的攻防對決</p>
  </section>

  <section id="modeScreen" class="screen mode-screen">
    <header class="mode-header">
      <p class="mode-kicker">SELECT MODE</p>
      <h2 class="mode-title">選擇遊戲模式</h2>
      <p class="mode-description">目前先開放單機模式，其餘模式保留為後續開發入口。</p>
    </header>

    <div class="mode-list">
      <button class="mode-card" data-mode="single" type="button">
        <span class="mode-number">MODE 01</span>
        <h3 class="mode-name">單機模式</h3>
        <p class="mode-desc">與 AI 進行三戰兩勝對決，依棋盤走勢計算傷害。</p>
        <span class="mode-status">可遊玩</span>
      </button>

      <button class="mode-card locked" data-mode="online" type="button">
        <span class="mode-number">MODE 02</span>
        <h3 class="mode-name">連線對戰</h3>
        <p class="mode-desc">與其他玩家進行即時配對或房間對戰。</p>
        <span class="mode-status locked">未開放</span>
      </button>

      <button class="mode-card locked" data-mode="ranked" type="button">
        <span class="mode-number">MODE 03</span>
        <h3 class="mode-name">競技模式</h3>
        <p class="mode-desc">使用積分與段位系統進行正式賽季對決。</p>
        <span class="mode-status locked">未開放</span>
      </button>

      <button class="mode-card locked" data-mode="special" type="button">
        <span class="mode-number">MODE 04</span>
        <h3 class="mode-name">特殊玩法</h3>
        <p class="mode-desc">使用特殊棋子、技能與額外勝利條件進行對戰。</p>
        <span class="mode-status locked">未開放</span>
      </button>
    </div>

    <footer class="mode-footer">
      <button id="backToHeroButton" class="mode-back" type="button">返回</button>
      <span class="mode-message">選擇單機模式即可開始</span>
    </footer>
  </section>

  <section id="battleScreen" class="screen battle-screen">
    <header class="battle-header">
      <section class="fighter-status">
        <div class="fighter-row"><span class="fighter-name">PLAYER</span><span id="playerHpText" class="hp-text">100 / 100</span></div>
        <div class="hp-shell"><div id="playerHpBar" class="hp player"></div></div>
      </section>

      <section class="score-center">
        <div class="score-row"><span id="playerScore" class="score player">0</span><span class="vs">VS</span><span id="aiScore" class="score ai">0</span></div>
        <span id="roundText" class="round">ROUND 1</span>
      </section>

      <section class="fighter-status ai">
        <div class="fighter-row"><span class="fighter-name">AI</span><span id="aiHpText" class="hp-text">100 / 100</span></div>
        <div class="hp-shell"><div id="aiHpBar" class="hp ai"></div></div>
      </section>
    </header>

    <div class="status-bar">
      <div class="turn-box"><span id="turnStone" class="turn-stone black"></span><span id="turnText" class="turn-text">等待回合開始</span></div>
      <span id="moveText" class="move">MOVE 0</span>
    </div>

    <section class="board-section">
      <div id="boardFrame" class="board-frame locked">
        <div class="board-grid">
          <div id="starPoints" class="star-points"></div>
          <div id="boardPoints" class="board-points"></div>
        </div>
      </div>
    </section>

    <footer class="battle-footer">
      <button id="battleBackButton" class="footer-btn" type="button">模式選擇</button>
      <span class="best-of">BEST OF 3</span>
      <button id="restartButton" class="footer-btn" type="button">重新對戰</button>
    </footer>
  </section>

  <div id="roundTransition" class="round-transition">
    <div class="round-content">
      <p id="roundLabel" class="round-label">ROUND 1</p>
      <h2 id="roundTitle" class="round-title">玩家先攻</h2>
      <p id="roundDescription" class="round-desc">PLAYER ATTACKS FIRST</p>
    </div>
  </div>

  <div id="resultOverlay" class="result-overlay">
    <section class="result-card">
      <p class="result-kicker">MATCH RESULT</p>
      <h2 id="resultTitle" class="result-title">玩家取得最終勝利</h2>
      <p id="resultDescription" class="result-desc">三戰兩勝對決結束。</p>
      <div class="final-score">
        <div><div>PLAYER</div><div id="finalPlayerScore" class="final-num" style="color:#9acbff">2</div></div>
        <div class="vs">VS</div>
        <div><div>AI</div><div id="finalAiScore" class="final-num" style="color:#f5aaaa">0</div></div>
      </div>
      <div class="result-actions">
        <button id="playAgainButton" class="primary-btn" type="button">重新對戰</button>
        <button id="resultModesButton" class="secondary-btn" type="button">返回模式選擇</button>
      </div>
    </section>
  </div>

  <div id="lockedToast" class="locked-toast">此模式尚未開放</div>
</main>

<script>
"use strict";

const EMPTY=0,PLAYER=1,AI=2,BOARD_SIZE=15,WIN_SCORE=2,MAX_HP=100;
const DIRECTIONS=[[0,1],[1,0],[1,1],[1,-1]];
const STARS=[[3,3],[3,11],[7,7],[11,3],[11,11]];

const $=id=>document.getElementById(id);
const app=$("app"),hero=$("heroScreen"),modes=$("modeScreen"),battle=$("battleScreen");
const boardFrame=$("boardFrame"),boardPoints=$("boardPoints"),starPoints=$("starPoints");
const roundTransition=$("roundTransition"),resultOverlay=$("resultOverlay"),lockedToast=$("lockedToast");

let board=[],currentPlayer=PLAYER,startingPlayer=PLAYER,roundNumber=1,moveCount=0;
let playerScore=0,aiScore=0,playerHp=MAX_HP,aiHp=MAX_HP;
let roundEnded=false,matchEnded=false,aiThinking=false,transitionRunning=false;
let lastMove=null,winningPositions=[],timers=[];

function setTimer(fn,delay){
  const id=setTimeout(()=>{timers=timers.filter(x=>x!==id);fn()},delay);
  timers.push(id);return id
}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}

function switchScreen(from,to){
  from.classList.add("fade-out");
  setTimeout(()=>{
    from.classList.remove("active","fade-out");
    to.classList.add("active");
  },600)
}

$("openModesButton").addEventListener("click",()=>switchScreen(hero,modes));
$("backToHeroButton").addEventListener("click",()=>switchScreen(modes,hero));
$("battleBackButton").addEventListener("click",()=>{clearTimers();switchScreen(battle,modes)});
$("resultModesButton").addEventListener("click",()=>{resultOverlay.classList.remove("show");switchScreen(battle,modes)});

document.querySelectorAll(".mode-card").forEach(card=>{
  card.addEventListener("click",()=>{
    if(card.dataset.mode==="single"){
      switchScreen(modes,battle);
      setTimeout(initMatch,620);
      return;
    }
    lockedToast.classList.add("show");
    setTimeout(()=>lockedToast.classList.remove("show"),1500);
  })
});

$("restartButton").addEventListener("click",initMatch);
$("playAgainButton").addEventListener("click",()=>{resultOverlay.classList.remove("show");initMatch()});

function initMatch(){
  clearTimers();
  playerScore=0;aiScore=0;playerHp=MAX_HP;aiHp=MAX_HP;roundNumber=1;matchEnded=false;
  resultOverlay.classList.remove("show");
  updateHud();
  startRound();
}

function startRound(){
  clearTimers();
  board=Array.from({length:BOARD_SIZE},()=>Array(BOARD_SIZE).fill(EMPTY));
  startingPlayer=roundNumber%2===1?PLAYER:AI;
  currentPlayer=startingPlayer;moveCount=0;roundEnded=false;aiThinking=false;transitionRunning=true;
  lastMove=null;winningPositions=[];
  createBoard();createStars();renderBoard();
  $("roundText").textContent=`ROUND ${roundNumber}`;
  $("turnText").textContent="等待攻守交換";
  boardFrame.classList.add("locked");
  boardFrame.classList.remove("player-turn");
  showRoundIntro();
}

function showRoundIntro(){
  $("roundLabel").textContent=`ROUND ${roundNumber}`;
  $("roundTitle").textContent=startingPlayer===PLAYER?"玩家先攻":"AI 先攻";
  $("roundDescription").textContent=startingPlayer===PLAYER?"PLAYER ATTACKS FIRST":"AI ATTACKS FIRST";
  roundTransition.classList.remove("fade-out");
  roundTransition.classList.add("show");
  setTimer(()=>roundTransition.classList.add("fade-out"),1500);
  setTimer(()=>{
    roundTransition.classList.remove("show","fade-out");
    transitionRunning=false;
    startingPlayer===PLAYER?beginPlayerTurn():beginAiTurn();
  },2050);
}

function createBoard(){
  boardPoints.innerHTML="";
  for(let r=0;r<BOARD_SIZE;r++){
    for(let c=0;c<BOARD_SIZE;c++){
      const b=document.createElement("button");
      b.className="intersection";b.type="button";b.dataset.row=r;b.dataset.col=c;
      b.style.left=`${c/(BOARD_SIZE-1)*100}%`;b.style.top=`${r/(BOARD_SIZE-1)*100}%`;
      b.addEventListener("click",handlePlayerMove);
      boardPoints.appendChild(b);
    }
  }
}

function createStars(){
  starPoints.innerHTML="";
  STARS.forEach(([r,c])=>{
    const s=document.createElement("span");s.className="star-point";
    s.style.left=`${c/(BOARD_SIZE-1)*100}%`;s.style.top=`${r/(BOARD_SIZE-1)*100}%`;
    starPoints.appendChild(s);
  })
}

function handlePlayerMove(e){
  if(roundEnded||matchEnded||aiThinking||transitionRunning||currentPlayer!==PLAYER)return;
  const r=+e.currentTarget.dataset.row,c=+e.currentTarget.dataset.col;
  if(board[r][c]!==EMPTY)return;
  placeStone(r,c,PLAYER);
}

function placeStone(r,c,player){
  if(roundEnded||matchEnded||transitionRunning||board[r][c]!==EMPTY)return;
  board[r][c]=player;moveCount++;lastMove={r,c,player};renderBoard();
  const win=checkWin(r,c,player);
  if(win.hasWon){winningPositions=win.positions;renderBoard();finishRound(player);return}
  if(moveCount>=BOARD_SIZE*BOARD_SIZE){finishRound(EMPTY);return}
  player===PLAYER?beginAiTurn():beginPlayerTurn();
}

function beginPlayerTurn(){
  if(roundEnded||matchEnded)return;
  currentPlayer=PLAYER;aiThinking=false;boardFrame.classList.remove("locked");boardFrame.classList.add("player-turn");
  updateTurn();
}

function beginAiTurn(){
  if(roundEnded||matchEnded)return;
  currentPlayer=AI;aiThinking=true;boardFrame.classList.add("locked");boardFrame.classList.remove("player-turn");
  updateTurn();
  setTimer(()=>{
    if(roundEnded||matchEnded||transitionRunning)return;
    const move=chooseAiMove();
    if(move)placeStone(move.r,move.c,AI);
  },520);
}

function chooseAiMove(){
  const empties=[];
  for(let r=0;r<BOARD_SIZE;r++)for(let c=0;c<BOARD_SIZE;c++)if(board[r][c]===EMPTY)empties.push({r,c});
  if(!empties.length)return null;
  const win=findImmediate(AI);if(win)return win;
  const block=findImmediate(PLAYER);if(block)return block;
  if(moveCount===0)return{r:7,c:7};
  let best=-Infinity,moves=[];
  for(const p of empties){
    if(nearby(p.r,p.c,2)===0)continue;
    const score=evaluateMove(p.r,p.c);
    if(score>best){best=score;moves=[p]}else if(score===best)moves.push(p);
  }
  if(!moves.length)moves=empties;
  return moves[Math.floor(Math.random()*moves.length)];
}

function findImmediate(player){
  for(let r=0;r<BOARD_SIZE;r++)for(let c=0;c<BOARD_SIZE;c++){
    if(board[r][c]!==EMPTY)continue;
    board[r][c]=player;const win=checkWin(r,c,player).hasWon;board[r][c]=EMPTY;
    if(win)return{r,c};
  }
  return null;
}

function evaluateMove(r,c){
  board[r][c]=AI;let score=evaluatePatterns(r,c,AI)*1.12;board[r][c]=EMPTY;
  board[r][c]=PLAYER;score+=evaluatePatterns(r,c,PLAYER);board[r][c]=EMPTY;
  score+=Math.max(0,12-(Math.abs(r-7)+Math.abs(c-7)))*.7;
  score+=nearby(r,c,2)*1.5;
  return score;
}

function evaluatePatterns(r,c,player){
  let total=0;
  for(const [dr,dc] of DIRECTIONS){
    const p=analyze(r,c,player,dr,dc);
    if(p.count>=5)total+=100000;
    else if(p.count===4&&p.open===2)total+=12000;
    else if(p.count===4&&p.open===1)total+=4200;
    else if(p.count===3&&p.open===2)total+=1100;
    else if(p.count===3&&p.open===1)total+=260;
    else if(p.count===2&&p.open===2)total+=80;
    else if(p.count===2&&p.open===1)total+=22;
  }
  return total;
}

function nearby(r,c,d){
  let n=0;
  for(let dr=-d;dr<=d;dr++)for(let dc=-d;dc<=d;dc++){
    if(!dr&&!dc)continue;
    const rr=r+dr,cc=c+dc;
    if(rr>=0&&rr<BOARD_SIZE&&cc>=0&&cc<BOARD_SIZE&&board[rr][cc]!==EMPTY)n++;
  }
  return n;
}

function checkWin(r,c,player){
  for(const [dr,dc] of DIRECTIONS){
    const pos=[{r,c}];
    collect(r,c,player,dr,dc,pos);collect(r,c,player,-dr,-dc,pos);
    if(pos.length>=5)return{hasWon:true,positions:pos};
  }
  return{hasWon:false,positions:[]};
}

function collect(r,c,player,dr,dc,pos){
  let rr=r+dr,cc=c+dc;
  while(rr>=0&&rr<BOARD_SIZE&&cc>=0&&cc<BOARD_SIZE&&board[rr][cc]===player){
    pos.push({r:rr,c:cc});rr+=dr;cc+=dc;
  }
}

function analyze(r,c,player,dr,dc){
  let count=1,open=0,rr=r+dr,cc=c+dc;
  while(rr>=0&&rr<BOARD_SIZE&&cc>=0&&cc<BOARD_SIZE&&board[rr][cc]===player){count++;rr+=dr;cc+=dc}
  if(rr>=0&&rr<BOARD_SIZE&&cc>=0&&cc<BOARD_SIZE&&board[rr][cc]===EMPTY)open++;
  rr=r-dr;cc=c-dc;
  while(rr>=0&&rr<BOARD_SIZE&&cc>=0&&cc<BOARD_SIZE&&board[rr][cc]===player){count++;rr-=dr;cc-=dc}
  if(rr>=0&&rr<BOARD_SIZE&&cc>=0&&cc<BOARD_SIZE&&board[rr][cc]===EMPTY)open++;
  return{count,open};
}

function calculateDamage(){
  const speed=Math.max(0,Math.min(7,Math.floor((55-moveCount)/5)));
  return Math.max(50,Math.min(64,50+speed));
}

function finishRound(winner){
  roundEnded=true;aiThinking=false;boardFrame.classList.add("locked");boardFrame.classList.remove("player-turn");
  if(winner===EMPTY){
    $("turnText").textContent="本局和棋";
    setTimer(()=>{roundNumber++;startRound()},2200);
    return;
  }
  const damage=calculateDamage();
  if(winner===PLAYER){playerScore++;aiHp=Math.max(0,aiHp-damage)}
  else{aiScore++;playerHp=Math.max(0,playerHp-damage)}
  matchEnded=playerScore>=WIN_SCORE||aiScore>=WIN_SCORE;
  updateHud(true,winner);
  $("turnText").textContent=winner===PLAYER?`玩家勝利，AI 受到 ${damage} 點傷害`:`AI 勝利，玩家受到 ${damage} 點傷害`;
  if(matchEnded){setTimer(showFinalResult,1500);return}
  setTimer(()=>{roundNumber++;startRound()},2300);
}

function showFinalResult(){
  const playerWon=playerScore>aiScore;
  $("resultTitle").textContent=playerWon?"玩家取得最終勝利":"AI 取得最終勝利";
  $("resultDescription").textContent=`${playerScore} VS ${aiScore}，三戰兩勝對決結束。`;
  $("finalPlayerScore").textContent=playerScore;$("finalAiScore").textContent=aiScore;
  resultOverlay.classList.add("show");
}

function updateHud(animate=false,winner=null){
  $("playerScore").textContent=playerScore;$("aiScore").textContent=aiScore;
  $("playerHpText").textContent=`${playerHp} / ${MAX_HP}`;$("aiHpText").textContent=`${aiHp} / ${MAX_HP}`;
  $("playerHpBar").style.width=`${playerHp}%`;$("aiHpBar").style.width=`${aiHp}%`;
  if(animate){
    const bar=winner===PLAYER?$("aiHpBar"):$("playerHpBar");
    bar.classList.add("flash");app.classList.add("shake");
    setTimer(()=>{bar.classList.remove("flash");app.classList.remove("shake")},450);
  }
}

function updateTurn(){
  const playerTurn=currentPlayer===PLAYER;
  $("turnStone").className=playerTurn?"turn-stone black":"turn-stone white";
  $("turnText").textContent=playerTurn?"玩家回合":"AI 思考中";
  boardFrame.classList.toggle("player-turn",playerTurn);
}

function renderBoard(){
  boardPoints.querySelectorAll(".intersection").forEach(el=>{
    const r=+el.dataset.row,c=+el.dataset.col,cell=board[r][c];
    el.innerHTML="";el.classList.remove("occupied","winner");
    if(cell===EMPTY)return;
    el.classList.add("occupied");
    const stone=document.createElement("span");stone.className=cell===PLAYER?"stone black":"stone white";el.appendChild(stone);
    if(lastMove&&lastMove.r===r&&lastMove.c===c){
      const marker=document.createElement("span");marker.className="last-marker";el.appendChild(marker);
    }
    if(winningPositions.some(p=>p.r===r&&p.c===c))el.classList.add("winner");
  });
  $("moveText").textContent=`MOVE ${moveCount}`;
}
</script>
